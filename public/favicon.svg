<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160">
  <!-- Fondo -->
  <rect width="400" height="160" rx="30" fill="#1a1a2e"/>
  
  <!-- Degradado de fondo -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="gradText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="160" rx="30" fill="url(#grad)"/>
  
  <!-- Texto eduLLM -->
  <text x="200" y="105" font-family="'Segoe UI', Arial, sans-serif" 
        font-size="64" font-weight="bold" fill="url(#gradText)" 
        text-anchor="middle" letter-spacing="4">
    eduLLM
  </text>
  
  <!-- Línea decorativa -->
  <line x1="80" y1="125" x2="320" y2="125" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  
  <!-- Estrellas decorativas -->
  <circle cx="50" cy="40" r="3" fill="#ffd369" opacity="0.6"/>
  <circle cx="350" cy="50" r="2" fill="#ffd369" opacity="0.4"/>
  <circle cx="380" cy="100" r="3" fill="#ffd369" opacity="0.5"/>
</svg>